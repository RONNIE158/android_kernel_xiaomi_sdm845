name: Build KGSL VNC Display Module

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    # 1️⃣ Checkout kernel
    - name: 🧩 Checkout kernel source
      uses: actions/checkout@v4
      with:
        repository: RONNIE158/android_kernel_xiaomi_sdm845
        ref: lineage-21
        path: kernel

    # 2️⃣ Setup environment
    - name: 🧰 Setup build environment
      run: |
        sudo apt update
        sudo apt install -y clang llvm lld bc bison flex libncurses5-dev libssl-dev ccache git wget curl

    # 3️⃣ Pull toolchain LineageOS
    - name: 🔽 Pull LineageOS Toolchains
      run: |
        mkdir -p toolchains
        cd toolchains
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 aarch64-linux-android-4.9
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 arm-linux-androideabi-4.9
        mkdir clang
        curl https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android14-dev/clang-r487747c.tar.gz -RLO
        tar -C clang/ -xf clang-*.tar.gz
        echo "✅ Toolchains ready"

    # 4️⃣ Inject driver KGSL VNC
    - name: ⚙️ Inject KGSL VNC Display Driver
      working-directory: kernel
      run: |
        mkdir -p drivers/gpu/kgsl-vnc

        # Driver source
        cat > drivers/gpu/kgsl-vnc/kgsl_vnc_display.c <<'EOF'
#include <linux/module.h>
#include <linux/kernel.h>
#include <linux/kthread.h>
#include <linux/net.h>
#include <linux/in.h>
#include <linux/slab.h>
#include <linux/delay.h>
#include <linux/kgsl.h>
#include <linux/mm.h>

#define VNC_PORT 5900

static struct socket *vnc_sock;
static struct task_struct *vnc_thread;
static int vnc_running = 1;

static int vnc_stream_thread(void *data)
{
    struct sockaddr_in saddr;
    int ret;

    ret = sock_create(AF_INET, SOCK_STREAM, IPPROTO_TCP, &vnc_sock);
    if (ret < 0) { pr_err("kgsl_vnc: socket create failed\n"); return ret; }

    saddr.sin_family = AF_INET;
    saddr.sin_addr.s_addr = htonl(INADDR_ANY);
    saddr.sin_port = htons(VNC_PORT);

    ret = vnc_sock->ops->bind(vnc_sock, (struct sockaddr *)&saddr, sizeof(saddr));
    if (ret < 0) { pr_err("kgsl_vnc: bind failed\n"); goto out; }

    ret = vnc_sock->ops->listen(vnc_sock, 1);
    if (ret < 0) { pr_err("kgsl_vnc: listen failed\n"); goto out; }

    pr_info("kgsl_vnc: waiting for client on port %d...\n", VNC_PORT);

    while (vnc_running) {
        struct socket *client = NULL;
        ret = vnc_sock->ops->accept(vnc_sock, &client, O_NONBLOCK);
        if (ret == 0 && client) {
            pr_info("kgsl_vnc: client connected\n");
            while (vnc_running) {
                char fb_data[1024];
                memset(fb_data, 0x55, sizeof(fb_data));
                kernel_sendmsg(client, &(struct msghdr){}, (struct kvec[]){{.iov_base = fb_data, .iov_len = sizeof(fb_data)}}, 1, sizeof(fb_data));
                msleep(33);
            }
            sock_release(client);
        }
        msleep(100);
    }

out:
    sock_release(vnc_sock);
    return 0;
}

static int __init kgsl_vnc_init(void)
{
    pr_info("kgsl_vnc: init\n");
    vnc_thread = kthread_run(vnc_stream_thread, NULL, "kgsl_vnc_stream");
    if (IS_ERR(vnc_thread)) return PTR_ERR(vnc_thread);
    return 0;
}

static void __exit kgsl_vnc_exit(void)
{
    vnc_running = 0;
    if (vnc_thread) kthread_stop(vnc_thread);
    pr_info("kgsl_vnc: exit\n");
}

module_init(kgsl_vnc_init);
module_exit(kgsl_vnc_exit);
MODULE_LICENSE("GPL");
MODULE_DESCRIPTION("KGSL Virtual Display Stream via VNC (Dummy)");
MODULE_AUTHOR("Bro Project");
EOF

        # Makefile
        echo "obj-m += kgsl_vnc_display.o" > drivers/gpu/kgsl-vnc/Makefile
        # Kconfig
        echo "source \"drivers/gpu/kgsl-vnc/Kconfig\"" >> drivers/gpu/Kconfig
        cat > drivers/gpu/kgsl-vnc/Kconfig <<'EOF'
config KGSL_VNC_DISPLAY
    tristate "KGSL VNC Display Streamer"
    depends on MSM_KGSL_DRM
    default n
    help
      Stream framebuffer via TCP (VNC placeholder)
EOF

    # 5️⃣ Build driver module + cek
    - name: 🧱 Build & Check KGSL VNC Module
      working-directory: kernel
      env:
        ARCH: arm64
        SUBARCH: arm64
        PATH: ${{ github.workspace }}/toolchains/clang/bin:$PATH
        CROSS_COMPILE: ${{ github.workspace }}/toolchains/aarch64-linux-android-4.9/bin/aarch64-linux-android-
        CROSS_COMPILE_ARM32: ${{ github.workspace }}/toolchains/arm-linux-androideabi-4.9/bin/arm-linux-androideabi-
        CC: clang
      run: |
        make O=out ARCH=arm64 beryllium_defconfig
        make O=out ARCH=arm64 drivers/gpu/kgsl-vnc/ -j$(nproc)
        mkdir -p ../kgsl-vnc-output
        find out -name "*.ko" -exec cp {} ../kgsl-vnc-output/ \;

        # ✅ Cek modul berhasil dibuat
        if [ -f ../kgsl-vnc-output/kgsl_vnc_display.ko ]; then
          echo "✅ Modul kgsl_vnc_display.ko berhasil dibuat"
          ls -lh ../kgsl-vnc-output/
        else
          echo "❌ Modul kgsl_vnc_display.ko tidak ditemukan!"
          exit 1
        fi

    # 6️⃣ Upload artifact
    - name: 📦 Upload module artifact
      uses: actions/upload-artifact@v4
      with:
        name: kgsl-vnc-module
        path: kgsl-vnc-output/
